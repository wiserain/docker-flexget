name: buildx

on:
  workflow_dispatch:
  schedule:
    - cron: "0 21 * * 5"
  push:
    branches:
      - 'master'

defaults:
  run:
    shell: bash

env:
  DOCKERHUB_USER: wiserain
  IMAGE_NAME: wiserain/flexget
  ALPINE_VER: '3.23'

jobs:
  buildx:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: write
    if: github.event_name != 'pull_request'
    steps:
      -
        name: Checkout
        uses: actions/checkout@v7
      -
        name: Compile requirements.txt
        run: |
          docker run --rm -i -v ${PWD}:/req alpine:${{ env.ALPINE_VER }} \
            sh -c "apk add py3-pip build-base python3-dev libffi-dev && rm /usr/lib/python*/EXTERNALLY-MANAGED && pip install pip-tools && cd /req && pip-compile -U"
      -
        name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      -
        name: Set up Buildx
        uses: docker/setup-buildx-action@v4
      -
        name: Get FlexGet Variables
        id: vars
        run: |
          VER_FULL=$(sed -nE 's/^flexget(\[[^]]+\])?==([^[:space:]]+).*/\2/p' requirements.txt | head -n 1)
          if [[ -z "${VER_FULL}" ]]; then
            echo "Could not determine FlexGet version from requirements.txt" >&2
            exit 1
          fi
          echo "ver_full=${VER_FULL}" >> "$GITHUB_OUTPUT"
          echo "ver_minor=$(echo "${VER_FULL}" | cut -d. -f-2)" >> "$GITHUB_OUTPUT"
          echo "ver_major=$(echo "${VER_FULL}" | cut -d. -f-1)" >> "$GITHUB_OUTPUT"
      -
        name: Login to docker.io
        uses: docker/login-action@v4
        with:
          username: ${{ env.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      -
        name: Login to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      -
        name: Buildx and Push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          tags: |
            ${{ env.IMAGE_NAME }}:ci
            ghcr.io/${{ env.IMAGE_NAME }}:ci
          platforms: linux/amd64,linux/arm64
          build-args: |
            ALPINE_VER=${{ env.ALPINE_VER }}
          cache-from: ${{ github.event_name != 'schedule' && format('type=registry,ref=ghcr.io/{0}:buildcache', env.IMAGE_NAME) || '' }}
          cache-to: type=registry,ref=ghcr.io/${{ env.IMAGE_NAME }}:buildcache,mode=max,compression=zstd
          no-cache: ${{ github.event_name == 'schedule' }}
          pull: true
          push: true
      -
        name: Verify Image
        env:
          EXPECTED_VER: ${{ steps.vars.outputs.ver_full }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail

          test -n "$IMAGE_DIGEST"

          IMAGE="${{ env.IMAGE_NAME }}@${IMAGE_DIGEST}"
          CID=$(docker run -d "${IMAGE}")
          cleanup() {
            docker rm -f "${CID}" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          ACTUAL_VER=$(docker exec "${CID}" flexget -V | sed -n 1p)
          if [[ "${ACTUAL_VER}" != "${EXPECTED_VER}" ]]; then
            echo "Expected FlexGet ${EXPECTED_VER}, got ${ACTUAL_VER}" >&2
            exit 1
          fi
      -
        name: Promote Tags
        run: |
          set -euo pipefail
          for image in "${IMAGE_NAME}" "ghcr.io/${IMAGE_NAME}"; do
            docker buildx imagetools create \
              --tag "${image}:latest" \
              --tag "${image}:${{ steps.vars.outputs.ver_full }}" \
              --tag "${image}:${{ steps.vars.outputs.ver_minor }}" \
              --tag "${image}:${{ steps.vars.outputs.ver_major }}" \
              "${image}@${{ steps.build.outputs.digest }}"
          done
      -
        name: Notification
        uses: sarisia/actions-status-discord@v1
        if: always()
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          status: ${{ job.status }}
          description: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.ver_full }}
            ${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.ver_minor }}
            ${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.ver_major }}
            ghcr.io/${{ env.IMAGE_NAME }}:latest
            ghcr.io/${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.ver_full }}
            ghcr.io/${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.ver_minor }}
            ghcr.io/${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.ver_major }}
      -
        name: Commit requirements.txt
        uses: EndBug/add-and-commit@v11
        with:
          message: |
            Update requirements.txt
      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: requirements.txt
          path: requirements.txt
