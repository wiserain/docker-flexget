name: buildx-on-pr

on:
  pull_request:

defaults:
  run:
    shell: bash

env:
  DOCKERHUB_USER: wiserain
  IMAGE_NAME: wiserain/flexget
  ALPINE_VER: '3.23'

jobs:
  buildx-on-pr:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    if: github.event_name == 'pull_request'
    steps:
      -
        name: Checkout
        uses: actions/checkout@v7
      -
        name: Compile requirements.txt
        run: |
          docker run --rm -i -v ${PWD}:/req alpine:${{ env.ALPINE_VER }} \
            sh -c "apk add py3-pip build-base python3-dev libffi-dev && rm /usr/lib/python*/EXTERNALLY-MANAGED && pip install pip-tools && cd /req && pip-compile -U"
      -
        name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      -
        name: Set up Buildx
        uses: docker/setup-buildx-action@v4
      -
        name: Login to ghcr.io
        uses: docker/login-action@v4
        if: github.actor == github.event.repository.owner.login
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      -
        name: Buildx and Push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          tags: |
            ghcr.io/${{ env.IMAGE_NAME }}:pr
            ghcr.io/${{ env.IMAGE_NAME }}:pr-${{ github.event.pull_request.number }}
          platforms: linux/amd64,linux/arm64
          build-args: |
            ALPINE_VER=${{ env.ALPINE_VER }}
          cache-from: |
            type=registry,ref=ghcr.io/${{ env.IMAGE_NAME }}:buildcache-pr-${{ github.event.pull_request.number }}
            type=registry,ref=ghcr.io/${{ env.IMAGE_NAME }}:buildcache
          cache-to: ${{ github.actor == github.event.repository.owner.login && format('type=registry,ref=ghcr.io/{0}:buildcache-pr-{1},mode=max,compression=zstd', env.IMAGE_NAME, github.event.pull_request.number) || '' }}
          pull: true
          push: ${{ github.actor == github.event.repository.owner.login }}
      -
        name: Notification
        uses: sarisia/actions-status-discord@v1
        if: always() && github.actor == github.event.repository.owner.login
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          status: ${{ job.status }}
          description: |
            ghcr.io/${{ env.IMAGE_NAME }}:pr
            ghcr.io/${{ env.IMAGE_NAME }}:pr-${{ github.event.pull_request.number }}
      -
        name: Upload Artifact
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: requirements.txt
          path: requirements.txt
